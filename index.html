<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Slow Hearth</title>
<meta name="description" content="The Slow Hearth: calm sleep stories for grown-ups, a new story every night.">
<style>
  :root { --bg:#0e122e; --card:#161b40; --text:#f4ecd6; --muted:#b9b3a3; --accent:#e8b060; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width:720px; margin:0 auto; padding:64px 16px; text-align:center; }
  img { width:160px; height:160px; border-radius:50%; }
  h1 { font-size:2.4rem; letter-spacing:.04em; margin:24px 0 4px; }
  .tag { color:var(--accent); margin:0 0 28px; }
  .pill { display:inline-block; border:2px solid var(--accent); border-radius:999px; padding:8px 22px; background:var(--card); }
  p { color:var(--muted); }
  a { color:var(--accent); }
  footer { margin-top:48px; font-size:.9rem; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="The Slow Hearth logo">
  <h1>THE SLOW HEARTH</h1>
  <p class="tag">Sleep Stories for Grown-Ups</p>
  <div class="pill">New story every night &bull; 8 PM ET / 1 AM UK</div>
  <p>Slow, gentle stories of rainy cabins, night trains and quiet villages, followed by hours of soft ambience so you never wake to silence.</p>
  <p><a href="https://www.youtube.com/@SlowHearthSleep">Listen on YouTube</a></p>
  <footer><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a></footer>
</main>
</body>
</html>
